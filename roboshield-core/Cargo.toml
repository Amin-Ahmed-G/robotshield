[package]
name = "roboshield-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pcap = "2.2.0"
toml = "0.8.19"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
chrono = { version = "0.4.39", features = ["serde"] }
byteorder = "1.5.0"
log = "0.4.22"
env_logger = "0.11.6"

[dev-dependencies]
tempfile = "3.16.0"
