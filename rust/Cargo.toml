[workspace]
resolver = "2"
members = ["fw_core", "robot_firewall", "firewall_console"]
exclude = ["vendor"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
rclrs = "=0.7.0"
fw_core = { path = "fw_core" }
sensor_msgs = "*"
std_msgs = "*"
std_srvs = "*"
diagnostic_msgs = "*"
builtin_interfaces = "*"

# rclrs 0.7.0 with one patch (see vendor/rclrs/PATCH.md); message crates are the
# Rust bindings shipped in the ROS 2 Jazzy binary packages.
[patch.crates-io]
rclrs = { path = "vendor/rclrs" }
sensor_msgs = { path = "/opt/ros/jazzy/share/sensor_msgs/rust" }
std_msgs = { path = "/opt/ros/jazzy/share/std_msgs/rust" }
std_srvs = { path = "/opt/ros/jazzy/share/std_srvs/rust" }
diagnostic_msgs = { path = "/opt/ros/jazzy/share/diagnostic_msgs/rust" }
builtin_interfaces = { path = "/opt/ros/jazzy/share/builtin_interfaces/rust" }
geometry_msgs = { path = "/opt/ros/jazzy/share/geometry_msgs/rust" }
service_msgs = { path = "/opt/ros/jazzy/share/service_msgs/rust" }
